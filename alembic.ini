[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is resolved at runtime by migrations/env.py from
# settings.mysql_dsn — do NOT hardcode it here.
sqlalchemy.url =

# Recursive autogenerate scan (we want to discover models under app/).
prepend_sys_path = .

# Force timezone-naive UTC for revision timestamps in filenames.
timezone = UTC


# [post_write_hooks] intentionally not configured — alembic's subprocess
# entry-point discovery does not see our uv-managed venv reliably. Run
# `make fmt` after generating a migration to format it.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
