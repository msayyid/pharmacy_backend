[project]
name = "pharmacy-api"
version = "0.1.0"
description = "Pharmacy Platform Backend — FastAPI + SQLAlchemy + MySQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Pharmacy Platform Team" }]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gunicorn>=23.0,<24.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncmy>=0.2.10,<0.3",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",
    "python-jose[cryptography]>=3.5,<4.0",  # 3.5+ closes CVE-2024-49638.
    "passlib[argon2]>=1.7.4,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "redis>=5.2,<6.0",
    "arq>=0.26,<0.27",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.18,<0.1",
    "structlog>=24.4,<25.0",
    "orjson>=3.10,<4.0",
    "tenacity>=9.0,<10.0",
    "phonenumbers>=8.13,<9.0",
    "python-slugify[unidecode]>=8.0,<9.0",
    "boto3>=1.35,<2.0",
    "pillow>=11.0,<12.0",
    "sentry-sdk[fastapi]>=2.18,<3.0",
    "prometheus-client>=0.21,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "asgi-lifespan>=2.1,<3.0",
    "factory-boy>=3.3,<4.0",
    "freezegun>=1.5,<2.0",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
    "types-passlib",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── ruff (BACKEND §24.2) ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # flake8-bugbear
    "UP",               # pyupgrade
    "N",                # pep8-naming
    "S",                # bandit (security)
    "ASYNC",            # async correctness
    "C4",               # comprehensions
    "RET",              # returns
    "SIM",              # simplifications
    "TID",              # tidy imports
    "PL",               # pylint subset
    "RUF",              # ruff-specific
]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]
"migrations/**" = ["E501", "I"]

# ─── mypy (BACKEND §24.3) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "asyncmy.*",
    "arq.*",
    "passlib.*",
    "jose.*",
    "phonenumbers.*",
    "factory.*",
    "freezegun.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests (full HTTP stack)",
    "integration: integration tests (real DB)",
    "unit: unit tests (no IO)",
]

# ─── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/worker.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
